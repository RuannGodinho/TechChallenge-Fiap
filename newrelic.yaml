        Name           kubernetes
        Match          kube.*
        Alias          kubernetes-enricher
        # We need the full DNS suffix as Windows only supports resolving names with this suffix
        # See: https://kubernetes.io/docs/setup/production-environment/windows/intro-windows-in-kubernetes/#dns-limitations
        Kube_URL       https://kubernetes.default.svc.cluster.local:443
        Buffer_Size    ${K8S_BUFFER_SIZE}
        K8S-Logging.Exclude ${K8S_LOGGING_EXCLUDE}
        Labels         Off
        Annotations    Off
    
    [FILTER]
        Name           nest
        Match          *
        Alias          kubernetes-attribute-lifter
        Operation      lift
        Nested_under   kubernetes
    
    [FILTER]
        Name           record_modifier
        Match          *
        Alias          node-attributes-enricher-filter
        Record         cluster_name "${CLUSTER_NAME}"
        Allowlist_key  container_name
        Allowlist_key  namespace_name
        Allowlist_key  pod_name
        Allowlist_key  stream
        Allowlist_key  message
        Allowlist_key  log
    
    [OUTPUT]
        Name           newrelic
        Match          *
        Alias          newrelic-logs-forwarder
        licenseKey     ${LICENSE_KEY}
        endpoint       ${ENDPOINT}
        lowDataMode    ${LOW_DATA_MODE}
        sendMetrics    ${SEND_OUTPUT_PLUGIN_METRICS}
        Retry_Limit    ${RETRY_LIMIT}
    
    
    [INPUT]
        Name   dummy
        Tag    buildInfo
        Dummy  {"message":"trigger for basic metric at every 10 minutes scrape_interval"}
        Interval_Sec 600
    [FILTER]
        Name    modify
        Match   buildInfo
        Add     fluentBitVersion  ${FBVERSION}
    [FILTER]
        Name    lua
        Match   buildInfo
        script  /fluent-bit/scripts/payload.lua
        call    build_payload
    [OUTPUT]
        Name    http
        Match   buildInfo
        Host    ${METRICS_HOST}
        Port    443
        URI     /metric/v1
        Format  json
        tls     On
        Header  Api-Key ${LICENSE_KEY}
        Header  Content-Type application/json
        json_date_key false
  parsers.conf: |
---
# Source: nri-bundle/charts/newrelic-logging/templates/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  namespace: newrelic
  labels:     
    app: newrelic-logging
    chart: newrelic-logging-1.40.0
    release: nri-bundle
    app.kubernetes.io/name: newrelic-logging
  name: nri-bundle-newrelic-logging-config
type: Opaque
data:
  license: MWE4MjE5OWQ4MzUxMDFiZmQyMjYwODdjNGVlYjJmYzZiZDJhTlJBTA==
---
# Source: nri-bundle/charts/newrelic-logging/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: newrelic-logging
    chart: newrelic-logging-1.40.0
    release: "nri-bundle"
  name: nri-bundle-newrelic-logging
  namespace: newrelic
---
# Source: lab/newrelic-logging-daemonset (mínimo, só API)
# Fluent Bit mínimo: só stdout da API (default), 1 pod por node.
# Reusa SA, ConfigMaps e Secret já criados pelo nri-bundle.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nri-bundle-newrelic-logging
  namespace: newrelic
  labels:
    app: newrelic-logging
    app.kubernetes.io/name: newrelic-logging
    release: nri-bundle
spec:
  selector:
    matchLabels:
      app: newrelic-logging
      release: nri-bundle
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: newrelic-logging
        release: nri-bundle
        kubernetes.io/os: linux
        app.kubernetes.io/name: newrelic-logging
    spec:
      serviceAccountName: nri-bundle-newrelic-logging
      terminationGracePeriodSeconds: 10
      containers:
        - name: newrelic-logging
          image: docker.io/newrelic/newrelic-fluentbit-output:3.8.0
          imagePullPolicy: IfNotPresent
          command:
            - /fluent-bit/bin/fluent-bit
            - -c
            - /fluent-bit/etc/fluent-bit.conf
            - -e
            - /fluent-bit/bin/out_newrelic.so
          env:
            - name: ENDPOINT
              value: https://log-api.newrelic.com/log/v1
            - name: SOURCE
              value: k8s
            - name: LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: nri-bundle-newrelic-logging-config
                  key: license
            - name: CLUSTER_NAME
              value: newrelic Cluster
            - name: LOG_LEVEL
              value: error
            - name: LOG_PARSER
              value: cri,docker
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FB_DB
              value: /var/log/flb_kube.db
            # Só pods da API no namespace default — não lê Mongo nem newrelic.
            - name: PATH
              value: /var/log/containers/api-deployment*_default_*.log
            - name: K8S_BUFFER_SIZE
              value: 16k
            - name: K8S_LOGGING_EXCLUDE
              value: "false"
            - name: LOW_DATA_MODE
              value: "true"
            - name: RETRY_LIMIT
              value: "3"
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SEND_OUTPUT_PLUGIN_METRICS
              value: "false"
            - name: METRICS_HOST
              value: metric-api.newrelic.com
            - name: FLUENTBIT_METRICS_TIER
              value: basic
            - name: DAEMONSET_NAME
              value: nri-bundle-newrelic-logging
            - name: NAMESPACE
              value: newrelic
          resources:
            requests:
              cpu: 15m
              memory: 24Mi
            limits:
              cpu: 80m
              memory: 48Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 2020
            initialDelaySeconds: 15
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc
            - name: logs
              mountPath: /var
            - name: lua-scripts
              mountPath: /fluent-bit/scripts
              readOnly: true
      volumes:
        - name: lua-scripts
          configMap:
            name: nri-bundle-newrelic-logging-lua
        - name: fluent-bit-config
          configMap:
            name: nri-bundle-newrelic-logging-fluent-bit-config
        - name: logs
          hostPath:
            path: /var
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists

