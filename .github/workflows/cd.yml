name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop, release]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "yes" to confirm deploy
        required: false
        default: ""

concurrency:
  group: cd-eks
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Confirm manual deploy
        if: github.event_name == 'workflow_dispatch' && inputs.confirm != 'yes'
        run: |
          echo "::error::Manual deploy requires confirm=yes."
          exit 1

      - name: Verify CI passed (manual deploy)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ github.ref_name }}"
          CONCLUSION=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=ci.yml \
            --branch="$BRANCH" \
            --limit=1 \
            --json conclusion \
            --jq '.[0].conclusion')
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Latest CI run on ${BRANCH} did not succeed (conclusion: ${CONCLUSION:-none}). Run CI first."
            exit 1
          fi
          echo "Latest CI on ${BRANCH}: success"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Resolve image tag
        id: image
        run: |
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [ "$BRANCH" = "release" ]; then
            echo "tag=homolog" >> "$GITHUB_OUTPUT"
            echo "environment=homolog" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "environment=production" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ruanngodinho/techchallenge:${{ steps.image.outputs.tag }}
          push: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.TF_AWS_REGION || 'us-east-1' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "${{ vars.TF_AWS_REGION || 'us-east-1' }}" \
            --name "${{ vars.TF_CLUSTER_NAME || 'techchallenge-eks' }}"

      - name: Deploy metrics-server
        run: |
          kubectl apply -f k8s/metrics-server.yml
          kubectl rollout status deployment/metrics-server -n kube-system --timeout=180s

      - name: Deploy New Relic
        run: |
          kubectl apply -f newrelic.yaml
          kubectl wait --for=condition=established crd/instrumentations.newrelic.com --timeout=60s
          kubectl rollout status deployment/nri-bundle-k8s-agents-operator -n newrelic --timeout=180s
          kubectl apply -f k8s/instrumentation.yaml

      - name: Deploy service-orders secrets and config
        env:
          SAGA_ENABLED: ${{ vars.SAGA_ENABLED }}
          GATEWAY_TRUST_SECRET: ${{ secrets.GATEWAY_TRUST_SECRET }}
          BILLING_INTERNAL_API_KEY: ${{ secrets.BILLING_INTERNAL_API_KEY }}
          EXECUTION_INTERNAL_API_KEY: ${{ secrets.EXECUTION_INTERNAL_API_KEY }}
          SERVICE_ORDERS_INTERNAL_API_KEY: ${{ secrets.SERVICE_ORDERS_INTERNAL_API_KEY }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os
          required = ["GATEWAY_TRUST_SECRET","BILLING_INTERNAL_API_KEY","EXECUTION_INTERNAL_API_KEY","SERVICE_ORDERS_INTERNAL_API_KEY","RABBITMQ_URL"]
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing GitHub secrets: ' + ', '.join(missing))
          data = {key: os.environ.get(key, '') for key in ["GATEWAY_TRUST_SECRET","BILLING_INTERNAL_API_KEY","EXECUTION_INTERNAL_API_KEY","SERVICE_ORDERS_INTERNAL_API_KEY","RABBITMQ_URL"]}
          payload = {'stringData': data}
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'service-orders-secrets.json'), 'w') as output:
              json.dump(payload, output)
          PY
          kubectl get configmap api-config --ignore-not-found -o json > "$RUNNER_TEMP/current-api-config.json"
          kubectl create --dry-run=client --validate=false -f k8s/secrets/Api-configmap.yml -o json | \
            node scripts/render-api-config.cjs "$RUNNER_TEMP/current-api-config.json" | kubectl apply -f -
          kubectl apply -f k8s/secrets/api-secrets.yml -f k8s/secrets/dockerhub-cred.yml
          kubectl patch secret api-secrets --type merge --patch-file "$RUNNER_TEMP/service-orders-secrets.json"
          kubectl create secret docker-registry dockerhub-cred \
            --docker-username="$DOCKERHUB_USERNAME" \
            --docker-password="$DOCKERHUB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Wait for Mongo from TechChallenge-infra-db
        run: |
          if ! kubectl get svc mongo-service >/dev/null 2>&1; then
            echo "::error::mongo-service ausente. Rode o CD do TechChallenge-infra-db antes da API."
            exit 1
          fi
          kubectl rollout status deployment/mongo-deployment --timeout=180s

      - name: Deploy API
        run: |
          kubectl apply -f k8s/Api-deployment.yml
          kubectl set image deployment/api-deployment api=ruanngodinho/techchallenge:${{ steps.image.outputs.tag }}
          kubectl apply -f k8s/Api-service.yml
          kubectl apply -f k8s/API-hpa.yml

      - name: Run API seed job
        run: |
          if ! kubectl get job api-seed-job >/dev/null 2>&1; then
            kubectl apply -f k8s/api-seed-job.yml
            kubectl wait --for=condition=complete job/api-seed-job --timeout=120s
          else
            echo "Seed job already exists — skipping."
          fi

      - name: Rollout API deployment
        run: |
          kubectl rollout restart deployment/api-deployment
          kubectl rollout status deployment/api-deployment --timeout=180s

      - name: Deploy grouped Service Orders workers
        run: |
          kubectl get svc rabbitmq-service
          kubectl rollout status deployment/rabbitmq-deployment --timeout=180s
          kubectl set image --local -f k8s/billing-consumer.yml \
            consumer=ruanngodinho/techchallenge:${{ steps.image.outputs.tag }} -o yaml | kubectl apply -f -
          kubectl rollout restart deployment/service-orders-billing-consumer
          kubectl rollout status deployment/service-orders-billing-consumer --timeout=180s

      - name: Write job summary
        run: |
          {
            echo "## CD deploy summary"
            echo ""
            echo "**Trigger:** \`${{ github.event_name }}\`"
            echo "**Image:** \`ruanngodinho/techchallenge:${{ steps.image.outputs.tag }}\`"
            echo "**Environment:** \`${{ steps.image.outputs.environment }}\`"
            echo "**Cluster:** \`${{ vars.TF_CLUSTER_NAME || 'techchallenge-eks' }}\`"
            echo ""
            echo "**Pods:**"
            echo '```'
            kubectl get pods -A
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
