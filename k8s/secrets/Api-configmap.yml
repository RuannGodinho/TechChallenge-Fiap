apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  PORT: '3000'
  MONGODB_URI: 'mongodb://mongo-service:27017/Node-Fiap?replicaSet=orders-rs'
  JWT_EXPIRES_IN: 1h
  AUTH_MODE: gateway
  NODE_ENV: production
  EXECUTION_SERVICE_URL: 'http://execution-service'
  BILLING_SERVICE_URL: 'http://billing'
  SAGA_ENABLED: 'false'
  SAGA_STEP_TIMEOUT_MS: '300000'
  SAGA_COMPENSATION_TIMEOUT_MS: '1800000'
