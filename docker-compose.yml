services:
  mongodb:
    image: mongo:8
    container_name: mongoDocker
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: Node-Fiap
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build: .
    container_name: oficina-api
    restart: on-failure:5
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongodb:27017/Node-Fiap
      MONGODB_URI: mongodb://mongodb:27017/Node-Fiap
      NODE_ENV: production
    env_file:
      - .env
    command: sh -c "node mongo-init/seed.js && npm start"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  billing-consumer:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build: .
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/Node-Fiap
      NODE_ENV: production
    command: npm run billing-consumer
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  execution-consumer:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build: .
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongodb:27017/Node-Fiap
      NODE_ENV: production
    command: npm run execution-consumer
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
