version: "3.9"

services:
  mongodb:
    image: mongo:8
    container_name: mongoDocker
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: Node-Fiap
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   # Tamanho máximo de cada arquivo de log (ex: 10 Megabytes)
        max-file: "3"     # Quantidade máxima de arquivos rotacionados a manter

  api:
    build: .
    container_name: oficina-api
    restart: on-failure:5
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongodb:27017/Node-Fiap
      NODE_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   # Tamanho máximo de cada arquivo de log (ex: 10 Megabytes)
        max-file: "3"     # Quantidade máxima de arquivos rotacionados a manter

volumes:
  mongo_data: