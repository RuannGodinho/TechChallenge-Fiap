services:
  mongodb:
    image: mongo:8
    command: ["mongod", "--replSet", "orders-rs", "--bind_ip_all"]
    container_name: mongoDocker
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: Node-Fiap
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongodb-init:
    image: mongo:8
    depends_on:
      mongodb:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mongosh --host mongodb:27017 --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; do sleep 1; done
        mongosh --host mongodb:27017 --quiet --eval 'try { rs.status(); } catch (e) { if(e.codeName!=="NotYetInitialized") throw e; rs.initiate({_id:"orders-rs",members:[{_id:0,host:"mongodb:27017"}]}); }'
  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build: .
    container_name: oficina-api
    restart: on-failure:5
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SAGA_ENABLED: ${SAGA_ENABLED:-false}
      PORT: 3000
      MONGO_URL: mongodb://mongodb:27017/Node-Fiap?replicaSet=orders-rs
      MONGODB_URI: mongodb://mongodb:27017/Node-Fiap?replicaSet=orders-rs
      NODE_ENV: production
    env_file:
      - .env
    command: sh -c "node mongo-init/seed.js && npm start"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  workers:
    build: .
    env_file: .env
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/Node-Fiap?replicaSet=orders-rs
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    command:
      - node
      - run-workers.cjs
      - src/infrastructure/messaging/billing-consumer.ts
      - src/infrastructure/messaging/execution-consumer.ts
      - src/infrastructure/messaging/saga-worker.ts


volumes:
  mongo_data:
