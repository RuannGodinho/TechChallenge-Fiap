# Override for SAM local simulation.
# Usage: docker compose -f docker-compose.yml -f docker-compose.sam.yml up -d --build
#
# Uses .env.sam so credentials match TechChallenge-lambda-auth/auth/env.local.json.

services:
  api:
    env_file:
      - .env.sam
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/swagger.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
